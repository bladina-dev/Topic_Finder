name: Telegram Command Handler

on:
  repository_dispatch:
    types: [telegram-command]

env:
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  handle-command:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Handle command
        run: |
          COMMAND="${{ github.event.client_payload.command }}"
          echo "Received command: $COMMAND"
          
          if [ "$COMMAND" = "/today" ]; then
            uv run python scripts/run_and_report.py
          elif [ "$COMMAND" = "/sources" ]; then
            uv run python -c "
          from src.source_manager import list_source_files
          from src.telegram_bot import send_text_sync
          files = list_source_files()
          msg = '📋 *Available Source Lists:*\n\n'
          for f in files:
              msg += f\"• {f['name']} ({f['count']} sources)\n\"
          send_text_sync(msg)
          "
          elif [ "$COMMAND" = "/status" ]; then
            uv run python -c "
          from src.telegram_bot import send_text_sync
          from src.source_manager import list_source_files
          files = list_source_files()
          total = sum(f['count'] for f in files)
          msg = '🤖 *Trendozer Status*\n\n'
          msg += f'📋 Source lists: {len(files)}\n'
          msg += f'🔗 Total sources: {total}\n'
          msg += '⏰ Schedule: 6:00 AM + 6:00 PM (Cairo)\n'
          msg += '✅ Bot is healthy'
          send_text_sync(msg)
          "
          else
            echo "Unknown command: $COMMAND"
          fi
